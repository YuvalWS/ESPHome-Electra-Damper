# Common configuration for all ESPHome devices
# Include this in your device config with: packages: { common: !include common.yaml }

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fallback Hotspot"
    password: !secret ap_password

# Captive portal for fallback AP
captive_portal:

# Web server
web_server:
  port: 80

# System time
time:
  - platform: sntp
    id: time_sntp
